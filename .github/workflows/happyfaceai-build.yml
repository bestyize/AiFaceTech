name: Build HappyFaceAi Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happyfaceai-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: HappyFaceAi

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: Make API 37 available to Gradle
        shell: bash
        run: |
          if [[ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" && ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v6
      - name: Test shared code and build APK
        run: ./gradlew --no-daemon :lib_business:lib_face:jvmTest :lib_business:lib_models:jvmTest :lib_business:lib_brains:jvmTest :lib_business:lib_voice:compileKotlinJvm :shared:jvmTest :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HappyFaceAi-Android-debug
          path: HappyFaceAi/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
