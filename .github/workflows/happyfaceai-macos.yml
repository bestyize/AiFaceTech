name: Build HappyFaceAi macOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happyfaceai-macos-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: HappyFaceAi

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: Make API 37 available to Gradle
        shell: bash
        run: |
          if [[ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" && ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v6
      - name: Build macOS DMG
        run: ./gradlew --no-daemon :desktopApp:packageDmg
      - uses: actions/upload-artifact@v4
        with:
          name: HappyFaceAi-macOS-dmg
          path: HappyFaceAi/desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
