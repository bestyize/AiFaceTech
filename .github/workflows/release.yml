name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，例如 1.0.0 或 v1.0.0"
        required: true
        type: string
      version_code:
        description: "Android versionCode（可选，默认按语义化版本自动换算）"
        required: false
        type: string
      release_name:
        description: "Release 标题（可选）"
        required: false
        type: string
      prerelease:
        description: "是否作为预发布版本"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      build_ref: ${{ steps.meta.outputs.build_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw_version="${{ github.event.inputs.version }}"
            input_version_code="${{ github.event.inputs.version_code }}"
            prerelease="${{ github.event.inputs.prerelease }}"
            release_name="${{ github.event.inputs.release_name }}"
          else
            raw_version="${GITHUB_REF_NAME}"
            input_version_code=""
            prerelease="false"
            release_name=""
          fi

          raw_version="${raw_version#refs/tags/}"
          if [[ "${raw_version}" == v* ]]; then
            tag="${raw_version}"
            version="${raw_version#v}"
          else
            tag="v${raw_version}"
            version="${raw_version}"
          fi

          if [[ -z "${release_name}" ]]; then
            release_name="HappyFaceAi ${version}"
          fi

          if [[ -n "${input_version_code}" ]]; then
            version_code="${input_version_code}"
          else
            version_core="${version%%[-+]*}"
            IFS='.' read -r major minor patch extra <<< "${version_core}"
            major="${major:-0}"
            minor="${minor:-0}"
            patch="${patch:-0}"
            if [[ -n "${extra}" || ! "${major}" =~ ^[0-9]+$ || ! "${minor}" =~ ^[0-9]+$ || ! "${patch}" =~ ^[0-9]+$ ]]; then
              echo "Version '${version}' must be semver-like (major.minor.patch) or provide version_code explicitly." >&2
              exit 1
            fi
            version_code="$((10#${major} * 10000 + 10#${minor} * 100 + 10#${patch}))"
          fi

          if git rev-parse "${tag}" >/dev/null 2>&1; then
            build_ref="${tag}"
          else
            build_ref="${GITHUB_SHA}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${release_name}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "build_ref=${build_ref}" >> "${GITHUB_OUTPUT}"

  build-android:
    needs: metadata
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HappyFaceAi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.build_ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Prepare Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0"

      - name: Decode signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        id: keystore
        shell: bash
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
          echo "path=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_OUTPUT}"

      - name: Build Android release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease \
            -PreleaseVersion="${{ needs.metadata.outputs.version }}" \
            -PreleaseVersionCode="${{ needs.metadata.outputs.version_code }}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: |
            HappyFaceAi/androidApp/build/outputs/apk/release/*.apk
            HappyFaceAi/androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  build-desktop:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: desktop-linux-release-assets
            artifact_path: HappyFaceAi/desktopApp/build/compose/binaries/main-release/*.deb
          - os: windows-latest
            artifact_name: desktop-windows-release-assets
            artifact_path: HappyFaceAi/desktopApp/build/compose/binaries/main-release/*.msi
          - os: macos-latest
            artifact_name: desktop-macos-release-assets
            artifact_path: HappyFaceAi/desktopApp/build/compose/binaries/main-release/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: HappyFaceAi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.build_ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Install WiX Toolset
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Build desktop package
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS \
            -PreleaseVersion="${{ needs.metadata.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    needs:
      - metadata
      - build-android
      - build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.build_ref }}

      - name: Ensure release tag exists
        shell: bash
        run: |
          tag="${{ needs.metadata.outputs.tag }}"
          build_ref="${{ needs.metadata.outputs.build_ref }}"

          if git rev-parse "${tag}" >/dev/null 2>&1; then
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --tags origin "${tag}:${tag}"
            exit 0
          fi

          git tag "${tag}" "${build_ref}"
          if git push origin "refs/tags/${tag}"; then
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --tags origin "${tag}:${tag}"
            exit 0
          fi

          exit 1

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*-release-assets"
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ needs.metadata.outputs.build_ref }}
          name: ${{ needs.metadata.outputs.release_name }}
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/**/*.apk
            release-assets/**/*.aab
            release-assets/**/*.deb
            release-assets/**/*.dmg
            release-assets/**/*.msi
