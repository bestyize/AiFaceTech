name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，例如 1.0.0 或 v1.0.0"
        required: true
        type: string
      version_code:
        description: "Android versionCode（可选，默认按语义化版本自动换算）"
        required: false
        type: string
      ios_bundle_id:
        description: "iOS Bundle Identifier（例如 com.aifacemate.face.HappyFaceAi）"
        required: false
        type: string
      release_name:
        description: "Release 标题（可选）"
        required: false
        type: string
      prerelease:
        description: "是否作为预发布版本"
        required: false
        default: false
        type: boolean
      publish:
        description: "是否创建 GitHub Release 并上传产物"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
      build_ref: ${{ steps.meta.outputs.build_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw_version="${{ github.event.inputs.version }}"
            input_version_code="${{ github.event.inputs.version_code }}"
            prerelease="${{ github.event.inputs.prerelease }}"
            release_name="${{ github.event.inputs.release_name }}"
            publish="${{ github.event.inputs.publish }}"
          else
            raw_version="${GITHUB_REF_NAME}"
            input_version_code=""
            prerelease="false"
            release_name=""
            publish="true"
          fi

          raw_version="${raw_version#refs/tags/}"
          if [[ "${raw_version}" == v* ]]; then
            tag="${raw_version}"
            version="${raw_version#v}"
          else
            tag="v${raw_version}"
            version="${raw_version}"
          fi

          if [[ -z "${release_name}" ]]; then
            release_name="HappyFaceAi ${version}"
          fi

          if [[ -n "${input_version_code}" ]]; then
            version_code="${input_version_code}"
          else
            version_core="${version%%[-+]*}"
            IFS='.' read -r major minor patch extra <<< "${version_core}"
            major="${major:-0}"
            minor="${minor:-0}"
            patch="${patch:-0}"
            if [[ -n "${extra}" || ! "${major}" =~ ^[0-9]+$ || ! "${minor}" =~ ^[0-9]+$ || ! "${patch}" =~ ^[0-9]+$ ]]; then
              echo "Version '${version}' must be semver-like (major.minor.patch) or provide version_code explicitly." >&2
              exit 1
            fi
            version_code="$((10#${major} * 10000 + 10#${minor} * 100 + 10#${patch}))"
          fi

          if git rev-parse "${tag}" >/dev/null 2>&1; then
            build_ref="${tag}"
          else
            build_ref="${GITHUB_SHA}"
          fi

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "version_code=${version_code}"
            echo "release_name=${release_name}"
            echo "prerelease=${prerelease}"
            echo "publish=${publish}"
            echo "build_ref=${build_ref}"
          } >> "${GITHUB_OUTPUT}"

  build-android:
    needs: metadata
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: HappyFaceAi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.build_ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Prepare Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0"

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        id: keystore
        shell: bash
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
          echo "path=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_OUTPUT}"

      - name: Build Android release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease \
            -PreleaseVersion="${{ needs.metadata.outputs.version }}" \
            -PreleaseVersionCode="${{ needs.metadata.outputs.version_code }}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: |
            HappyFaceAi/androidApp/build/outputs/apk/release/*.apk
            HappyFaceAi/androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  build-ios:
    needs: metadata
    runs-on: macos-latest
    env:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ios_bundle_id || secrets.IOS_BUNDLE_ID }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
    defaults:
      run:
        working-directory: HappyFaceAi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.build_ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Prepare iOS signing assets
        if: ${{ env.IOS_TEAM_ID != '' && env.IOS_CERTIFICATE_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != '' && env.IOS_CODE_SIGN_IDENTITY != '' }}
        id: ios_signing
        shell: bash
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="${RUNNER_TEMP}/ios_distribution.p12"
          PROFILE_PATH="${RUNNER_TEMP}/ios_profile.mobileprovision"
          PROFILE_PLIST="${RUNNER_TEMP}/ios_profile.plist"

          printf '%s' "${IOS_CERTIFICATE_BASE64}" | base64 --decode > "${CERT_PATH}"
          printf '%s' "${IOS_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${PROFILE_PATH}"

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "${PROFILE_PATH}" > "${PROFILE_PLIST}"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "${PROFILE_PLIST}")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "${PROFILE_PLIST}")"
          cp "${PROFILE_PATH}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -P "${IOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          mapfile -t EXISTING_KEYCHAINS < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"$//')
          security list-keychains -d user -s "${KEYCHAIN_PATH}" "${EXISTING_KEYCHAINS[@]}"

          {
            echo "keychain_path=${KEYCHAIN_PATH}"
            echo "profile_name=${PROFILE_NAME}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build iOS archive
        id: build_ios
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
          KEYCHAIN_PATH: ${{ steps.ios_signing.outputs.keychain_path }}
          PROFILE_NAME: ${{ steps.ios_signing.outputs.profile_name }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          chmod +x gradlew

          ARCHIVE_PATH="${RUNNER_TEMP}/HappyFaceAi.xcarchive"
          EXPORT_PATH="${RUNNER_TEMP}/ios-export"
          DERIVED_DATA_PATH="${RUNNER_TEMP}/ios-derived-data"
          BUNDLE_ID="${BUNDLE_ID:-}"

          rm -rf "${ARCHIVE_PATH}" "${EXPORT_PATH}" "${DERIVED_DATA_PATH}"
          if [[ -z "${BUNDLE_ID}" ]]; then
            echo "IOS_BUNDLE_ID must be configured for iOS packaging." >&2
            exit 1
          fi

          if [[ -n "${KEYCHAIN_PATH}" && -n "${PROFILE_NAME}" ]]; then
            xcodebuild \
              -project iosApp/iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Release \
              -archivePath "${ARCHIVE_PATH}" \
              -derivedDataPath "${DERIVED_DATA_PATH}" \
              -destination "generic/platform=iOS" \
              TEAM_ID="${IOS_TEAM_ID}" \
              DEVELOPMENT_TEAM="${IOS_TEAM_ID}" \
              PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
              MARKETING_VERSION="${RELEASE_VERSION}" \
              CURRENT_PROJECT_VERSION="${RELEASE_VERSION_CODE}" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="${IOS_CODE_SIGN_IDENTITY}" \
              PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
              OTHER_CODE_SIGN_FLAGS="--keychain ${KEYCHAIN_PATH}" \
              archive

            python -c "from pathlib import Path; import os, plistlib; export_options = {'method': os.environ.get('IOS_EXPORT_METHOD') or 'app-store', 'signingStyle': 'manual', 'signingCertificate': os.environ['IOS_CODE_SIGN_IDENTITY'], 'teamID': os.environ['IOS_TEAM_ID'], 'provisioningProfiles': {os.environ['BUNDLE_ID']: os.environ['PROFILE_NAME']}}; plistlib.dump(export_options, Path(os.environ['RUNNER_TEMP'], 'ExportOptions.plist').open('wb'))"

            xcodebuild -exportArchive \
              -archivePath "${ARCHIVE_PATH}" \
              -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
              -exportPath "${EXPORT_PATH}"

            PACKAGE_PATH="${RUNNER_TEMP}/HappyFaceAi-ios.xcarchive.zip"
            ditto -c -k --sequesterRsrc --keepParent "${ARCHIVE_PATH}" "${PACKAGE_PATH}"
          else
            xcodebuild \
              -project iosApp/iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Release \
              -derivedDataPath "${DERIVED_DATA_PATH}" \
              -destination "generic/platform=iOS Simulator" \
              PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
              MARKETING_VERSION="${RELEASE_VERSION}" \
              CURRENT_PROJECT_VERSION="${RELEASE_VERSION_CODE}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build

            APP_PATH="${DERIVED_DATA_PATH}/Build/Products/Release-iphonesimulator/HappyFaceAi.app"
            PACKAGE_PATH="${RUNNER_TEMP}/HappyFaceAi-ios-simulator.app.zip"
            ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${PACKAGE_PATH}"
          fi

          IPA_PATH=""
          if compgen -G "${EXPORT_PATH}/*.ipa" > /dev/null; then
            IPA_PATH="$(compgen -G "${EXPORT_PATH}/*.ipa" | head -n 1)"
          fi
          {
            echo "package_path<<EOF"
            echo "${PACKAGE_PATH}"
            echo "EOF"
            echo "export_path<<EOF"
            echo "${EXPORT_PATH}"
            echo "EOF"
            echo "ipa_path<<EOF"
            echo "${IPA_PATH}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-assets
          path: ${{ steps.build_ios.outputs.package_path }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: ${{ steps.build_ios.outputs.ipa_path != '' }}
        with:
          name: ios-signed-release-assets
          path: ${{ steps.build_ios.outputs.ipa_path }}
          if-no-files-found: error

  build-desktop:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: desktop-linux-release-assets
            artifact_path: HappyFaceAi/desktopApp/build/compose/binaries/main-release/*.deb
          - os: windows-latest
            artifact_name: desktop-windows-release-assets
            artifact_path: HappyFaceAi/desktopApp/build/compose/binaries/main-release/*.msi
          - os: macos-latest
            artifact_name: desktop-macos-release-assets
            artifact_path: HappyFaceAi/desktopApp/build/compose/binaries/main-release/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: HappyFaceAi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.build_ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Install WiX Toolset
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Build desktop package
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS \
            -PreleaseVersion="${{ needs.metadata.outputs.version }}"

      - name: Build desktop package
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          ./gradlew.bat :desktopApp:packageReleaseDistributionForCurrentOS `
            -PreleaseVersion="${{ needs.metadata.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    needs:
      - metadata
      - build-android
      - build-ios
      - build-desktop
    runs-on: ubuntu-latest
    if: ${{ needs.metadata.outputs.publish == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.build_ref }}

      - name: Ensure release tag exists
        shell: bash
        run: |
          tag="${{ needs.metadata.outputs.tag }}"
          build_ref="${{ needs.metadata.outputs.build_ref }}"

          if git rev-parse "${tag}" >/dev/null 2>&1; then
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --tags origin "${tag}:${tag}"
            exit 0
          fi

          git tag "${tag}" "${build_ref}"
          if git push origin "refs/tags/${tag}"; then
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --tags origin "${tag}:${tag}"
            exit 0
          fi

          echo "Failed to create or fetch release tag ${tag} for ${build_ref}." >&2
          exit 1

      - uses: actions/download-artifact@v4.1.3
        with:
          path: release-assets
          pattern: "*release-assets*"
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ needs.metadata.outputs.build_ref }}
          name: ${{ needs.metadata.outputs.release_name }}
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/**/*.apk
            release-assets/**/*.aab
            release-assets/**/*.deb
            release-assets/**/*.dmg
            release-assets/**/*.ipa
            release-assets/**/*.msi
            release-assets/**/*.app.zip
            release-assets/**/*.xcarchive.zip
