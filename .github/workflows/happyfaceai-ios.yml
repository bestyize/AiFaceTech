name: Build HappyFaceAi iOS Simulator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happyfaceai-ios-simulator-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: HappyFaceAi

jobs:
  ios-simulator:
    name: iOS Simulator app (unsigned)
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: Make API 37 available to Gradle
        shell: bash
        run: |
          if [[ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" && ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v6
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/happyface-ios" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Zip simulator app
        run: |
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/happyface-ios/Build/Products/Debug-iphonesimulator/HappyFaceAi.app" \
            "$RUNNER_TEMP/HappyFaceAi-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: HappyFaceAi-iOS-Simulator
          path: ${{ runner.temp }}/HappyFaceAi-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
